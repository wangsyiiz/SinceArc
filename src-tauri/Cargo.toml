[package]
name = "sincearc"
version = "0.0.5"
description = "SinceArc — an ACP desktop client"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "sincearc_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
agent-client-protocol = "3.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 单例启动（docs/desktop-ux.md §30）：必须是第一个注册的插件
tauri-plugin-single-instance = "2"
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
