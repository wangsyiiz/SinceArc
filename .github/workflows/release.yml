name: release

# Windows-only release (docs/distribution.md §7：只做 Win x64)。
#
# 为什么在 CI 上能出 NSIS、本地不能：Tauri 首次打包要从 GitHub 下载 nsis-3.11.zip，
# 本机到 GitHub 不通（§6），而 runner 本身就在 GitHub 网络里，下载没问题。
#
# 触发（两条）：
#   - push tag v*        → 正式版：出产物 + 建 GitHub Release（带版号，成为 latest）
#   - workflow_dispatch  → 手动跑：ref 是 tag 就照样建 Release；ref 是分支就只出产物（自检流水线）
#
# 发版只认 tag —— 合并到 main 不自动发版。日常发版不用手敲 git tag：
# 用 Actions 里的「tag-release」工作流点一下 Run workflow，它从 tauri.conf.json 读版本号建 tag
# 再派发本工作流（见 docs/distribution.md §5）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读版本号（与 tauri.conf.json 单一来源一致）
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: 校验版本一致性（tag 名 / tauri.conf.json / package.json）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $v) {
            throw "版本不一致：tauri.conf.json=$v，package.json=$pkg —— 改成同一个号再重跑"
          }
          # tag 构建必须 tag 名与配置版本一致，否则 Release 名/附件名/客户端自报版本会互相打架，
          # 自动更新会认为「已是最新」直接静默失效
          if ("${{ github.ref }}" -like "refs/tags/*") {
            if ("${{ github.ref_name }}" -ne "v$v") {
              throw "tag 与版本不一致：tag=${{ github.ref_name }}，配置版本=v$v。要么删掉这个 tag 重打，要么把 tauri.conf.json 的 version 改成与 tag 相符的号"
            }
            Write-Host "版本一致性 OK：v$v"
          } else {
            Write-Host "非 tag 构建（${{ github.ref }}），只校验 package.json 与 tauri.conf.json 一致"
          }

      - name: 读 CHANGELOG 段落（中文 + 英文，见 docs/distribution.md §11）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force .ci | Out-Null

          # 从某个 CHANGELOG 文件里取 "## v<版本>" 段落（到下一个 "## " 为止）
          function Get-ChangelogSection([string]$Path) {
            $body = @()
            if (Test-Path $Path) {
              $in = $false
              foreach ($line in (Get-Content $Path -Encoding utf8)) {
                if ($line -match '^##\s') {
                  $in = $line -match "^##\s+\[?v?$([regex]::Escape($v))\]?(\s|$)"
                  continue
                }
                if ($in -and $line.Trim()) { $body += $line.TrimEnd() }
              }
            }
            return $body
          }

          $zh = Get-ChangelogSection CHANGELOG.md
          $en = Get-ChangelogSection CHANGELOG.en.md

          # 双语拼成同一份 notes（latest.json 只有一个 notes 字段）：中文在前，缺哪语就不写那个小标题
          $out = @()
          if ($zh.Count -gt 0) { $out += @("### 中文", "") + $zh + @("") }
          if ($en.Count -gt 0) { $out += @("### English", "") + $en + @("") }
          if ($out.Count -eq 0) { $out = @("- 见提交历史") }

          ($out -join "`n").TrimEnd() | Set-Content .ci/changelog-section.md -Encoding utf8
          Write-Host "CHANGELOG v$v：中文 $($zh.Count) 行 / 英文 $($en.Count) 行"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 门禁（不绿不出包）
        run: |
          npm run build
          npm test

      - name: 单元测试 + clippy
        working-directory: src-tauri
        run: |
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      # 带 bundle 的构建：在 runner 上 NSIS 可下载，产出 setup.exe
      - name: 构建（NSIS + 可执行文件 + 更新签名）
        env:
          # minisign 私钥只放 Secrets；丢了就再也签不出能装的更新（docs/distribution.md §9.2）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: 打便携包
        run: npm run package:win

      - name: 打 MSIX（微软商店包，未签名）
        shell: pwsh
        env:
          # 商店身份：Partner Center 里预留产品后，把 IdentityName / Publisher 填进仓库变量即可，
          # 不用改代码（docs/distribution.md §13）。默认值是测试身份，只能配合开发者模式安装。
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'SinceArc.Dev' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=SinceArc Dev' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'SinceArc' }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "src-tauri/target/release/sincearc.exe"
          if (-not (Test-Path $exe)) { throw "缺少 $exe（tauri build 没产出）" }

          $layout = "artifacts/msix/layout"
          Remove-Item $layout -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          Copy-Item $exe "$layout/SinceArc.exe"
          foreach ($f in "Square150x150Logo.png", "Square44x44Logo.png", "StoreLogo.png") {
            Copy-Item "src-tauri/icons/$f" "$layout/Assets/$f"
          }

          # MSIX 版本必须四段：0.0.12 -> 0.0.12.0
          $msixVer = "$v.0"
          $manifest = Get-Content src-tauri/msix/AppxManifest.xml -Raw
          $manifest = $manifest.Replace("__IDENTITY_NAME__", $env:MSIX_IDENTITY_NAME)
          $manifest = $manifest.Replace("__PUBLISHER__", $env:MSIX_PUBLISHER)
          $manifest = $manifest.Replace("__PUBLISHER_DISPLAY_NAME__", $env:MSIX_PUBLISHER_DISPLAY_NAME)
          $manifest = $manifest.Replace("__DISPLAY_NAME__", "SinceArc")
          $manifest = $manifest.Replace("__VERSION__", $msixVer)
          Set-Content -Path "$layout/AppxManifest.xml" -Value $manifest -Encoding utf8

          # makeappx 在 Windows SDK 里，runner 自带；版本目录按文件名倒序取最高
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "找不到 makeappx.exe：runner 上 Windows SDK 缺失" }

          New-Item -ItemType Directory -Force out | Out-Null
          $msix = "out/SinceArc_${v}_x64.msix"
          & $makeappx.FullName pack /d $layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx 打包失败（退出码 $LASTEXITCODE）" }
          Write-Host "MSIX 已产出：$msix（身份 $env:MSIX_IDENTITY_NAME / $env:MSIX_PUBLISHER / $msixVer，未签名）"
          Get-Item $msix | Format-List Name, Length

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $portable = Get-ChildItem "artifacts/windows/SinceArc-*-win-x64.zip"
          Copy-Item $portable.FullName out/
          # 再放一份不带版本号的名字：官网/README 用稳定链接指向
          # releases/latest/download/SinceArc-win-x64.zip，升版本时不用改站点
          Copy-Item $portable.FullName "out/SinceArc-win-x64.zip"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($setup) {
            Copy-Item $setup.FullName out/
            Copy-Item $setup.FullName "out/SinceArc_x64-setup.exe"
          } else {
            Write-Warning "没找到 NSIS 安装包"
          }

          # 未签名分发：给出校验和，至少让人能核对下载是否完整
          Get-ChildItem out -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding utf8

          Get-ChildItem out | Format-Table Name, Length

      - name: 生成 latest.json（自动更新清单）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sigFile) {
            throw "没找到 NSIS 的 .sig：确认 bundle.createUpdaterArtifacts=true 且签名密钥已注入"
          }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          # 只认正式版：端点指向该 tag 下的 setup.exe，不用 latest（否则历史版本会指到别人的包）
          $tag = "${{ github.ref_name }}"
          $asset = "SinceArc_${v}_x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
          $notes = (Get-Content .ci/changelog-section.md -Raw -Encoding utf8).Trim()

          $doc = [ordered]@{
            version   = $v
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $signature; url = $url } }
          }
          ($doc | ConvertTo-Json -Depth 5) | Set-Content -Path out/latest.json -Encoding utf8
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: sincearc-win-x64-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: 建/更新 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $lines = @(
            "Windows x64 预览版（v$v）。",
            "",
            "### 本次内容",
            "",
            (Get-Content .ci/changelog-section.md -Raw -Encoding utf8).Trim(),
            "",
            "| 文件 | 用途 |",
            "| --- | --- |",
            "| SinceArc-$v-win-x64.zip | 便携版，解压即用 |",
            "| SinceArc-win-x64.zip | 同上，稳定文件名（releases/latest/download 可直接链） |",
            "| SinceArc_${v}_x64-setup.exe | NSIS 安装包 |",
            "| SinceArc_${v}_x64.msix | 微软商店包（MSIX，**未签名测试版**） |",
            "| SHA256SUMS.txt | 校验和 |",
            "",
            "**MSIX 包是测试用**：未签名，需要 Windows「开发者模式」才能装 ——",
            "`Add-AppxPackage -AllowUnsigned .\SinceArc_${v}_x64.msix`。",
            "它的数据落在 %LOCALAPPDATA%\Packages\<包族名>\LocalCache\Roaming\com.sincearc.app，",
            "与安装包/便携版互不相通（同一个应用的两个安装形态，见 docs/distribution.md §13）。",
            "",
            "**未签名**：首次运行 SmartScreen 提示「未知发布者」，选「更多信息 → 仍要运行」。",
            "需要 WebView2 运行时（Win11 与较新 Win10 自带）；数据在 %APPDATA%\com.sincearc.app。",
            "细节见 docs/distribution.md。"
          )
          ($lines -join "`n") | Set-Content -Path out/RELEASE_NOTES.md -Encoding utf8
          $assets = Get-ChildItem out/* -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }

          # 幂等：同一个 tag 重跑（构建失败重试、或派发与 tag push 都触发了）不该红
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖同名资产与说明"
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "SinceArc $v" --notes-file out/RELEASE_NOTES.md
          } else {
            gh release create $tag $assets --title "SinceArc $v" --notes-file out/RELEASE_NOTES.md
          }
