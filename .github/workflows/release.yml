name: release

# Windows-only release (docs/distribution.md §7：只做 Win x64)。
#
# 为什么在 CI 上能出 NSIS、本地不能：Tauri 首次打包要从 GitHub 下载 nsis-3.11.zip，
# 本机到 GitHub 不通（§6），而 runner 本身就在 GitHub 网络里，下载没问题。
#
# 触发（三条，各管一件事）：
#   - push tag v*            → 正式版：出产物 + 建 GitHub Release（带版号，成为 latest）
#   - push main              → 持续构建：出产物 + 更新预发布 rolling release（tag=continuous），
#                              不发正式版，避免每次合并都堆一个版本号
#   - workflow_dispatch      → 只出产物，不建任何 Release，用来自检流水线
#
# 为什么主分支也要产出：官网/README 指向 releases/latest/download/<稳定文件名>，
# 正式版一打就自动跟着走；想试最新 main 的人则走 continuous 那一条。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读版本号（与 tauri.conf.json 单一来源一致）
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 门禁（不绿不出包）
        run: |
          npm run build
          npm test

      - name: 单元测试 + clippy
        working-directory: src-tauri
        run: |
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      # 带 bundle 的构建：在 runner 上 NSIS 可下载，产出 setup.exe
      - name: 构建（NSIS + 可执行文件）
        run: npm run tauri -- build --bundles nsis

      - name: 打便携包
        run: npm run package:win

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $portable = Get-ChildItem "artifacts/windows/SinceArc-*-win-x64.zip"
          Copy-Item $portable.FullName out/
          # 再放一份不带版本号的名字：官网/README 用稳定链接指向
          # releases/latest/download/SinceArc-win-x64.zip，升版本时不用改站点
          Copy-Item $portable.FullName "out/SinceArc-win-x64.zip"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($setup) {
            Copy-Item $setup.FullName out/
            Copy-Item $setup.FullName "out/SinceArc_x64-setup.exe"
          } else {
            Write-Warning "没找到 NSIS 安装包"
          }

          # 未签名分发：给出校验和，至少让人能核对下载是否完整
          Get-ChildItem out -File | Where-Object { $_.Extension -in '.zip', '.exe' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding utf8

          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sincearc-win-x64-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: 建正式 Release（tag v*）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = @(
            "Windows x64 预览版（v$v）。",
            "",
            "| 文件 | 用途 |",
            "| --- | --- |",
            "| SinceArc-$v-win-x64.zip | 便携版，解压即用 |",
            "| SinceArc-win-x64.zip | 同上，稳定文件名（releases/latest/download 可直接链） |",
            "| SinceArc_${v}_x64-setup.exe | NSIS 安装包 |",
            "| SHA256SUMS.txt | 校验和 |",
            "",
            "**未签名**：首次运行 SmartScreen 提示「未知发布者」，选「更多信息 → 仍要运行」。",
            "需要 WebView2 运行时（Win11 与较新 Win10 自带）；数据在 %APPDATA%\com.sincearc.app。",
            "细节见 docs/distribution.md。"
          )
          ($lines -join "`n") | Set-Content -Path out/RELEASE_NOTES.md -Encoding utf8
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem out/* -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }) `
            --title "SinceArc $v" `
            --notes-file out/RELEASE_NOTES.md

      - name: 更新持续构建 Release（push main）
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $lines = @(
            "main 分支的持续构建，每个合并都覆盖更新——**不是正式版**，正式版看 Releases 里的 v* 标签。",
            "",
            "- commit: $sha",
            "- 构建时间: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC",
            "",
            "| 文件 | 用途 |",
            "| --- | --- |",
            "| SinceArc-win-x64.zip | 便携版（稳定文件名，releases/download/continuous 可直接链） |",
            "| SinceArc_x64-setup.exe | NSIS 安装包 |",
            "| SHA256SUMS.txt | 校验和 |",
            "",
            "未签名；只用于试最新改动，不要当发布版分发。"
          )
          ($lines -join "`n") | Set-Content -Path out/RELEASE_NOTES.md -Encoding utf8

          $exists = $true
          gh release view continuous *> $null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if ($exists) {
            # 覆盖同名资产，保持 asset 名稳定，官网链接不会失效
            # RELEASE_NOTES.md 只是喂 gh 的临时文件，不挂成资产
            $assets = Get-ChildItem out/* -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }
            gh release upload continuous $assets --clobber
            gh release edit continuous --notes-file out/RELEASE_NOTES.md --prerelease
          } else {
            gh release create continuous `
              (Get-ChildItem out/* -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }) `
              --title "Continuous build (main)" `
              --notes-file out/RELEASE_NOTES.md `
              --prerelease
          }
