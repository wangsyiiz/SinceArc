name: release

# Windows-only release (docs/distribution.md §7：只做 Win x64)。
#
# 为什么在 CI 上能出 NSIS、本地不能：Tauri 首次打包要从 GitHub 下载 nsis-3.11.zip，
# 本机到 GitHub 不通（§6），而 runner 本身就在 GitHub 网络里，下载没问题。
#
# 触发（两条）：
#   - push tag v*        → 正式版：出产物 + 建 GitHub Release（带版号，成为 latest）
#   - workflow_dispatch  → 手动跑：ref 是 tag 就照样建 Release；ref 是分支就只出产物（自检流水线）
#
# 发版只认 tag —— 合并到 main 不自动发版。日常发版不用手敲 git tag：
# 用 Actions 里的「tag-release」工作流点一下 Run workflow，它从 tauri.conf.json 读版本号建 tag
# 再派发本工作流（见 docs/distribution.md §5）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # 本次发布要不要同时送微软商店审核（§13.8）。
      # 默认 false：商店每次提交都要走认证（几小时到 1-2 天），不该成为每个 tag 的默认动作。
      # 人工在「Run workflow」里勾，或由 tag-release 透传 —— 不做常驻仓库变量开关：
      # 那种开关总有人忘了关，结果一次手滑就把内部版本推给全体用户。
      submit_to_store:
        description: "同时提交到 Microsoft Store 审核"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读版本号（与 tauri.conf.json 单一来源一致）
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: 校验版本一致性（tag 名 / tauri.conf.json / package.json）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $v) {
            throw "版本不一致：tauri.conf.json=$v，package.json=$pkg —— 改成同一个号再重跑"
          }
          # tag 构建必须 tag 名与配置版本一致，否则 Release 名/附件名/客户端自报版本会互相打架，
          # 自动更新会认为「已是最新」直接静默失效
          if ("${{ github.ref }}" -like "refs/tags/*") {
            if ("${{ github.ref_name }}" -ne "v$v") {
              throw "tag 与版本不一致：tag=${{ github.ref_name }}，配置版本=v$v。要么删掉这个 tag 重打，要么把 tauri.conf.json 的 version 改成与 tag 相符的号"
            }
            Write-Host "版本一致性 OK：v$v"
          } else {
            Write-Host "非 tag 构建（${{ github.ref }}），只校验 package.json 与 tauri.conf.json 一致"
          }

      - name: 读 CHANGELOG 段落（中文 + 英文，见 docs/distribution.md §11）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force .ci | Out-Null

          # 从某个 CHANGELOG 文件里取 "## v<版本>" 段落（到下一个 "## " 为止）
          function Get-ChangelogSection([string]$Path) {
            $body = @()
            if (Test-Path $Path) {
              $in = $false
              foreach ($line in (Get-Content $Path -Encoding utf8)) {
                if ($line -match '^##\s') {
                  $in = $line -match "^##\s+\[?v?$([regex]::Escape($v))\]?(\s|$)"
                  continue
                }
                if ($in -and $line.Trim()) { $body += $line.TrimEnd() }
              }
            }
            return $body
          }

          $zh = Get-ChangelogSection CHANGELOG.md
          $en = Get-ChangelogSection CHANGELOG.en.md

          # 双语拼成同一份 notes（latest.json 只有一个 notes 字段）：中文在前，缺哪语就不写那个小标题
          $out = @()
          if ($zh.Count -gt 0) { $out += @("### 中文", "") + $zh + @("") }
          if ($en.Count -gt 0) { $out += @("### English", "") + $en + @("") }
          if ($out.Count -eq 0) { $out = @("- 见提交历史") }

          ($out -join "`n").TrimEnd() | Set-Content .ci/changelog-section.md -Encoding utf8
          Write-Host "CHANGELOG v$v：中文 $($zh.Count) 行 / 英文 $($en.Count) 行"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 门禁（不绿不出包）
        run: |
          npm run build
          npm test

      - name: 单元测试 + clippy
        working-directory: src-tauri
        run: |
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      # 带 bundle 的构建：在 runner 上 NSIS 可下载，产出 setup.exe
      - name: 构建（NSIS + 可执行文件 + 更新签名）
        env:
          # minisign 私钥只放 Secrets；丢了就再也签不出能装的更新（docs/distribution.md §9.2）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: 打便携包
        run: npm run package:win

      - name: 打 MSIX（送审包 + 本地测试包）
        shell: pwsh
        env:
          # 三个身份变量来自仓库 Variables，值必须与 Partner Center 的 Package/Identity 页逐字一致：
          #   Package/Identity/Name、Package/Identity/Publisher、Properties/PublisherDisplayName
          # 商店包的 Publisher **不带 OID**；带了就是未签名命名空间，认证会按身份不匹配拒掉（§13.2）。
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "src-tauri/target/release/sincearc.exe"
          if (-not (Test-Path $exe)) { throw "缺少 $exe（tauri build 没产出）" }
          foreach ($k in "MSIX_IDENTITY_NAME", "MSIX_PUBLISHER", "MSIX_PUBLISHER_DISPLAY_NAME") {
            if (-not (Get-Item "env:$k").Value) { throw "仓库变量 $k 没设：商店包身份必须与 Partner Center 一致（docs/distribution.md §13.2）" }
          }

          # 商店版必须带 feature store（§13.4）：不注册内置更新器，更新入口跳商店。
          # 上一步 tauri build 出的是直装版，这里覆盖成商店版再打包 —— NSIS 已产好，不受影响。
          # 注意仓库根没有 Cargo.toml（它在 src-tauri/），所以必须用 --manifest-path。
          # store 连带 custom-protocol（§13.6），但内嵌前端还得 dist 在场 —— 少了它编出来的
          # 包一开就是「连接 localhost 失败」，而 makeappx 不会报任何错。
          if (-not (Test-Path "dist/index.html")) {
            throw "dist 不存在：商店版会把 devUrl 打进包（先跑 npm run build）"
          }
          $before = (Get-Item $exe).LastWriteTimeUtc
          cargo build --manifest-path src-tauri/Cargo.toml --release --features store --bin sincearc
          if ($LASTEXITCODE -ne 0) { throw "商店版编译失败（cargo build --features store）" }
          $after = (Get-Item $exe).LastWriteTimeUtc
          if ($after -le $before) {
            throw "商店版 exe 没被重编（时间戳没变）：别把直装版打进商店包"
          }

          # 两个包，身份只差 OID 后缀（§13.5）：
          #   SinceArc_<v>_x64.msix           送审用 —— 真实身份、无 OID
          #   SinceArc_<v>_x64-unsigned.msix  本地测试 —— 同身份 + OID，开发者模式 -AllowUnsigned 才装得上
          $msixVer = "$v.0"
          $template = Get-Content src-tauri/msix/AppxManifest.xml -Raw
          function New-Manifest([string]$publisher) {
            $m = $template
            $m = $m.Replace("__IDENTITY_NAME__", $env:MSIX_IDENTITY_NAME)
            $m = $m.Replace("__PUBLISHER__", $publisher)
            $m = $m.Replace("__PUBLISHER_DISPLAY_NAME__", $env:MSIX_PUBLISHER_DISPLAY_NAME)
            $m = $m.Replace("__DISPLAY_NAME__", "SinceArc")
            $m = $m.Replace("__VERSION__", $msixVer)
            # 注释解析时会被忽略，但校验工具做字符串级检查时会读到 OID 字样，送审包干脆不留注释
            return [regex]::Replace($m, "(?s)<!--.*?-->", "").Trim()
          }

          # makeappx 在 Windows SDK 里，runner 自带；版本目录按文件名倒序取最高
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "找不到 makeappx.exe：runner 上 Windows SDK 缺失" }

          New-Item -ItemType Directory -Force out | Out-Null
          $targets = @(
            @{ Tag = "store";    Publisher = $env:MSIX_PUBLISHER; File = "out/SinceArc_${v}_x64.msix" },
            @{ Tag = "unsigned"; Publisher = "$env:MSIX_PUBLISHER, OID.2.25.311729368913984317654407730594956997722=1"; File = "out/SinceArc_${v}_x64-unsigned.msix" }
          )
          foreach ($t in $targets) {
            $layout = "artifacts/msix/$($t.Tag)"
            Remove-Item $layout -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
            Copy-Item $exe "$layout/SinceArc.exe"
            foreach ($f in "Square150x150Logo.png", "Square44x44Logo.png", "StoreLogo.png") {
              Copy-Item "src-tauri/icons/$f" "$layout/Assets/$f"
            }
            New-Manifest $t.Publisher | Set-Content -Path "$layout/AppxManifest.xml" -Encoding utf8
            & $makeappx.FullName pack /d $layout /p $t.File /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx 打包失败（$($t.Tag)，退出码 $LASTEXITCODE）" }
            $grew = (Get-Item $t.File).Length
            Write-Host "已产出 $($t.File)（$grew B，身份 $env:MSIX_IDENTITY_NAME / $($t.Publisher) / $msixVer）"
          }

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $portable = Get-ChildItem "artifacts/windows/SinceArc-*-win-x64.zip"
          Copy-Item $portable.FullName out/
          # 再放一份不带版本号的名字：官网/README 用稳定链接指向
          # releases/latest/download/SinceArc-win-x64.zip，升版本时不用改站点
          Copy-Item $portable.FullName "out/SinceArc-win-x64.zip"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($setup) {
            Copy-Item $setup.FullName out/
            Copy-Item $setup.FullName "out/SinceArc_x64-setup.exe"
          } else {
            Write-Warning "没找到 NSIS 安装包"
          }

          # 未签名分发：给出校验和，至少让人能核对下载是否完整
          Get-ChildItem out -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path out/SHA256SUMS.txt -Encoding utf8

          Get-ChildItem out | Format-Table Name, Length

      - name: 生成 latest.json（自动更新清单）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sigFile) {
            throw "没找到 NSIS 的 .sig：确认 bundle.createUpdaterArtifacts=true 且签名密钥已注入"
          }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          # 只认正式版：端点指向该 tag 下的 setup.exe，不用 latest（否则历史版本会指到别人的包）
          $tag = "${{ github.ref_name }}"
          $asset = "SinceArc_${v}_x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
          $notes = (Get-Content .ci/changelog-section.md -Raw -Encoding utf8).Trim()

          $doc = [ordered]@{
            version   = $v
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $signature; url = $url } }
          }
          ($doc | ConvertTo-Json -Depth 5) | Set-Content -Path out/latest.json -Encoding utf8
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: sincearc-win-x64-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: 建/更新 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $lines = @(
            "Windows x64 预览版（v$v）。",
            "",
            "### 本次内容",
            "",
            (Get-Content .ci/changelog-section.md -Raw -Encoding utf8).Trim(),
            "",
            "| 文件 | 用途 |",
            "| --- | --- |",
            "| SinceArc-$v-win-x64.zip | 便携版，解压即用 |",
            "| SinceArc-win-x64.zip | 同上，稳定文件名（releases/latest/download 可直接链） |",
            "| SinceArc_${v}_x64-setup.exe | NSIS 安装包 |",
            "| SinceArc_${v}_x64.msix | 微软商店（MSIX）**送审包**，用于提交审核，本地装不上 |",
            "| SinceArc_${v}_x64-unsigned.msix | 同一份代码的**本地测试包**，开发者模式可装 |",
            "| SHA256SUMS.txt | 校验和 |",
            "",
            "**两个 MSIX 只差一个 OID 后缀**：送审包的发布者必须等于 Partner Center 预留值，",
            "没有 OID 就别想本地旁加载（会报 0x80073D2C，正常）；想在本地跑就用 `-unsigned` 那个，",
            "管理员 PowerShell + 开发者模式 ——",
            "`Add-AppxPackage -Path .\SinceArc_${v}_x64-unsigned.msix -AllowUnsigned`。",
            "它的数据与便携版/安装包**共用** %APPDATA%\com.sincearc.app（full trust 包不做重定向，",
            "两个形态别同时开：同一个库、同一份日志，见 docs/distribution.md §13.3）。",
            "",
            "**未签名**：首次运行 SmartScreen 提示「未知发布者」，选「更多信息 → 仍要运行」。",
            "需要 WebView2 运行时（Win11 与较新 Win10 自带）；数据在 %APPDATA%\com.sincearc.app。",
            "细节见 docs/distribution.md。"
          )
          ($lines -join "`n") | Set-Content -Path out/RELEASE_NOTES.md -Encoding utf8
          $assets = Get-ChildItem out/* -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName }

          # 幂等：同一个 tag 重跑（构建失败重试、或派发与 tag push 都触发了）不该红
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖同名资产与说明"
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "SinceArc $v" --notes-file out/RELEASE_NOTES.md
          } else {
            gh release create $tag $assets --title "SinceArc $v" --notes-file out/RELEASE_NOTES.md
          }

      # 商店送审（§13.8）：逐次决定 —— 只有本次派发时勾了 submit_to_store 才跑。
      # 每次提交都要认证（几小时到 1-2 天），所以这个开关按「这一次」算，不是常驻配置。
      - name: 安装 Microsoft Store CLI
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.submit_to_store == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.2

      - name: 送审到 Microsoft Store
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.submit_to_store == 'true'
        # 送审失败不该把「Release 已发出去」这件事拖红：两条链路互不依赖。
        # 但必须留痕 —— 失败会以 warning 注解出现在 run 摘要（§13.8 里写了怎么查）。
        continue-on-error: true
        shell: pwsh
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $msix = "out/SinceArc_${v}_x64.msix"
          if (-not (Test-Path $msix)) { throw "缺少送审包 $msix" }
          if (-not $env:PRODUCT_ID) { throw "仓库变量 STORE_PRODUCT_ID 没设（9N… 开头）" }
          foreach ($k in "TENANT", "SELLER", "CLIENT", "SECRET") {
            if (-not (Get-Item "env:$k").Value) { throw "secret $k 没配：见 docs/distribution.md §13.8" }
          }

          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure 失败：检查 4 个 secret 与 Partner Center 的 Manager 角色" }

          msstore apps list
          if ($LASTEXITCODE -ne 0) { throw "msstore apps list 失败：凭据或角色不对（§13.8）" }

          # 版本必须严格大于商店里已发布的版本，服务端会校验；被拒时原话会留在日志里。
          # 命令形状按 MS 文档《Publishing app updates to Microsoft Store with GitHub Actions》：
          #   第一个位置参数是 .msix 路径，-id 才是 Store 产品 ID（9N…）
          $msixPath = (Resolve-Path $msix).Path
          msstore publish $msixPath -id $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::msstore publish 失败（版本未递增 / 被拒 / 草稿冲突，见上面输出）"
            exit 1
          }
          Write-Host "已提交商店审核：$msix"
