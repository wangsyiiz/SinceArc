name: pages

# GitHub Pages：从 website/ 静态目录直接发布，不跑构建（纯 HTML/CSS，零外部请求）。
# 需要仓库设置里 Pages 的 source = GitHub Actions（workflow 会自动尝试 enable）。

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 尝试启用 Pages（已启用会返回 409，忽略）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f build_type=workflow -f source[branch]=main -f source[path]=/ || true
          gh api "repos/${{ github.repository }}/pages" 2>/dev/null || echo "Pages 未启用（可能是套餐限制）"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
