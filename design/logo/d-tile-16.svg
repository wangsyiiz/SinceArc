<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" color="#ffffff">
  <defs>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/></linearGradient>
  </defs>
  <!-- D 磁贴 16/24/32/48：标识 0.72（比无辉光版 0.79 收一点，给辉光让出边缘）+ 三层辉光。
       辉光用「加粗 + 低透明度」的叠层，不用高斯模糊：在 16~48px 的磁贴里，
       模糊半径按比例只有零点几个像素，等于没有；叠层在降采样后才会真的亮出来。 -->
  <rect x="32" y="32" width="960" height="960" rx="232" fill="#1a1d26"/>
  <rect x="33" y="33" width="958" height="958" rx="231"
        fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <g opacity="0.10">
